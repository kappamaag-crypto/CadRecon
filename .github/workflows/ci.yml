name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: python3 -m pip install --user --quiet ezdxf
      - name: Independent DXF parse check
        run: |
          python3 - <<'PY'
          import ezdxf
          d=ezdxf.readfile('/tmp/cadrecon-test.dxf')
          ms=d.modelspace()
          for name in ('LINE','DIMENSION','TEXT','CIRCLE','HATCH'):
              assert len(ms.query(name))>=1, 'Missing '+name
          audit=d.audit()
          assert not audit.has_errors, str(audit.errors)
          print('DXF R2000 successfully parsed: '+str(len(ms))+' objects')
          semantic=ezdxf.readfile('/tmp/cadrecon-eskd-test.dxf')
          marks=semantic.modelspace().query('INSERT')
          assert len(marks)==12, f'Expected 12 ESKD INSERT blocks, got {len(marks)}'
          audit2=semantic.audit()
          assert not audit2.has_errors, str(audit2.errors)
          print('All 12 ESKD INSERT blocks validated')
          PY
      - name: ZIP archive smoke check
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/cadrecon-test.zip') as z:
              assert len(z.namelist()) == 2
              assert 'лист_01.dxf' in z.namelist()
              assert z.testzip() is None
          print('ZIP archive validated')
          PY
      - run: npm run build
      - name: Install browser for UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npx playwright test
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: test-results/
          if-no-files-found: ignore