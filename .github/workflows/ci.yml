name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: python3 -m pip install --user --quiet ezdxf
      - name: Independent DXF parse check
        run: |
          python3 - <<'PY'
          import ezdxf
          d=ezdxf.readfile('/tmp/cadrecon-test.dxf')
          ms=d.modelspace()
          for name in ('LINE','DIMENSION','TEXT','CIRCLE','HATCH'):
              assert len(ms.query(name))>=1, 'Missing '+name
          audit=d.audit()
          assert not audit.has_errors, str(audit.errors)
          print('DXF R2000 successfully parsed: '+str(len(ms))+' objects')
          semantic=ezdxf.readfile('/tmp/cadrecon-eskd-test.dxf')
          marks=semantic.modelspace().query('INSERT')
          assert len(marks)==12, f'Expected 12 ESKD INSERT blocks, got {len(marks)}'
          audit2=semantic.audit()
          assert not audit2.has_errors, str(audit2.errors)
          print('All 12 ESKD INSERT blocks validated')
          spline=ezdxf.readfile('/tmp/cadrecon-spline-test.dxf')
          cad_splines=spline.modelspace().query('SPLINE')
          assert len(cad_splines)==1, f'Expected 1 editable SPLINE, got {len(cad_splines)}'
          assert len(cad_splines[0].control_points)==4
          assert len(cad_splines[0].knots)==8
          assert spline.header.get('$INSUNITS')==0, 'Uncalibrated PDF cannot claim mm'
          assert not spline.audit().has_errors
          print('Native cubic SPLINE and unitless uncalibrated header audited')
          styled=ezdxf.readfile('/tmp/cadrecon-styled-test.dxf')
          styles=set(e.dxf.linetype for e in styled.modelspace().query('LINE'))
          assert {'DASHED','CENTER'}.issubset(styles), styles
          assert 'DASHED' in styled.linetypes and 'CENTER' in styled.linetypes
          assert not styled.audit().has_errors, 'Styled DXF invalid'
          print('Native DASHED and CENTER linetypes validated independently')

          PY
      - name: ZIP archive smoke check
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/cadrecon-test.zip') as z:
              assert len(z.namelist()) == 2
              assert 'лист_01.dxf' in z.namelist()
              assert z.testzip() is None
          print('ZIP archive validated')
          PY
      - name: Validate Python OCR geometry service without downloading models
        run: |
          python3 -m pip install --quiet -r backend/requirements-test.txt
          python3 -m unittest discover -s backend/tests -v
      - run: npm run build
      - name: Install browser for UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npx playwright test
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: test-results/
          if-no-files-found: ignore
      - name: Upload W0 synthetic baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-baseline-diagnostics
          path: |
            test-results/w0-vector-baseline.json
            test-results/w0-ctm-baseline.json
            test-results/w0-scan-baseline.json
            test-results/w3-clean-quality.json
            test-results/w3-degraded-quality.json
            test-results/w3-2x-quality.json
          if-no-files-found: ignore
          retention-days: 14
